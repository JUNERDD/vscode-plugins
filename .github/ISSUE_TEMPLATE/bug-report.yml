name: Bug report
description: Report reproducible incorrect behavior in Git Toolkit.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Git Toolkit
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Git Toolkit version
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version and operating system
      placeholder: VS Code 1.xx.x on macOS, Windows, or Linux
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest sample file, commit, or repository shape that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, private repository content, and other sensitive information first.
      render: shell
