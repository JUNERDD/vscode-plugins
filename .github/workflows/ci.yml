name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, Build, and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit:dependencies

      - name: Package extensions
        run: pnpm package:vsix

      - name: Verify extension packages
        run: pnpm verify:vsix

      - name: Upload Git Toolkit package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: git-toolkit-${{ github.sha }}
          path: |
            extensions/git-toolkit/git-toolkit-*.vsix
            extensions/git-toolkit/git-toolkit-*.vsix.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Selection Clipboard package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selection-clipboard-${{ github.sha }}
          path: |
            extensions/selection-clipboard/selection-clipboard-*.vsix
            extensions/selection-clipboard/selection-clipboard-*.vsix.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
