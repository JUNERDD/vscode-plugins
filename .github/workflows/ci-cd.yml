name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "diff-preview-v*"

permissions:
  contents: read

jobs:
  build:
    name: Check, Build, and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/diff-preview-v')
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./extensions/diff-preview/package.json').version")"
          tag_version="${GITHUB_REF_NAME#diff-preview-v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match diff-preview version ${package_version}."
            exit 1
          fi

      - name: Run checks
        run: pnpm check

      - name: Package extension
        run: pnpm package:vsix

      - name: Verify package and create checksum
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./extensions/diff-preview/package.json').version")"
          artifact="extensions/diff-preview/diff-preview-${package_version}.vsix"
          test -f "$artifact"
          unzip -tq "$artifact"
          manifest_version="$(
            unzip -p "$artifact" extension/package.json |
              node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version"
          )"
          if [[ "$manifest_version" != "$package_version" ]]; then
            echo "::error::Packaged extension version ${manifest_version} does not match package version ${package_version}."
            exit 1
          fi
          (
            cd extensions/diff-preview
            sha256sum "diff-preview-${package_version}.vsix" \
              > "diff-preview-${package_version}.vsix.sha256"
          )

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: diff-preview
          path: |
            extensions/diff-preview/diff-preview-*.vsix
            extensions/diff-preview/diff-preview-*.vsix.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/diff-preview-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: diff-preview
          path: artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              artifacts/*.vsix artifacts/*.sha256 --clobber
          else
            gh release create "$TAG_NAME" \
              artifacts/*.vsix artifacts/*.sha256 \
              --title "Diff Preview ${TAG_NAME#diff-preview-}" \
              --generate-notes
          fi
