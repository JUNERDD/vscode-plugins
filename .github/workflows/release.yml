name: Release

on:
  push:
    tags:
      - "commit-tree-v*"
      - "diff-preview-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      display-name: ${{ steps.target.outputs.display-name }}
      extension: ${{ steps.target.outputs.extension }}
      previous-tag: ${{ steps.target.outputs.previous-tag }}
      version: ${{ steps.target.outputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            commit-tree-v*)
              extension="commit-tree"
              display_name="Commit Tree"
              version="${GITHUB_REF_NAME#commit-tree-v}"
              ;;
            diff-preview-v*)
              extension="diff-preview"
              display_name="Diff Preview"
              version="${GITHUB_REF_NAME#diff-preview-v}"
              ;;
            *)
              echo "::error::Unsupported release tag ${GITHUB_REF_NAME}."
              exit 1
              ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not contain a valid semantic version."
            exit 1
          fi

          package_version="$(node -p "require('./extensions/${extension}/package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match ${extension} version ${package_version}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must point to a commit reachable from main."
            exit 1
          fi

          previous_tag=""
          while IFS= read -r candidate_tag; do
            if [[ "$candidate_tag" != "$GITHUB_REF_NAME" ]] && \
              git merge-base --is-ancestor "$candidate_tag" "$GITHUB_SHA"; then
              previous_tag="$candidate_tag"
              break
            fi
          done < <(git tag --list "${extension}-v*" --sort=-version:refname)

          echo "display-name=${display_name}" >> "$GITHUB_OUTPUT"
          echo "extension=${extension}" >> "$GITHUB_OUTPUT"
          echo "previous-tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit:dependencies

      - name: Package release target
        env:
          EXTENSION_NAME: ${{ steps.target.outputs.extension }}
        run: pnpm --dir "extensions/${EXTENSION_NAME}" package:vsix

      - name: Verify release package
        env:
          EXTENSION_NAME: ${{ steps.target.outputs.extension }}
        run: node scripts/verify-vsix.mjs "extensions/${EXTENSION_NAME}"

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.target.outputs.extension }}-${{ steps.target.outputs.version }}
          path: |
            extensions/${{ steps.target.outputs.extension }}/${{ steps.target.outputs.extension }}-${{ steps.target.outputs.version }}.vsix
            extensions/${{ steps.target.outputs.extension }}/${{ steps.target.outputs.extension }}-${{ steps.target.outputs.version }}.vsix.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.extension }}-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Verify checksum
        env:
          EXTENSION_NAME: ${{ needs.build.outputs.extension }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: artifacts
        run: sha256sum --check "${EXTENSION_NAME}-${VERSION}.vsix.sha256"

      - name: Publish immutable release assets
        env:
          DISPLAY_NAME: ${{ needs.build.outputs.display-name }}
          EXTENSION_NAME: ${{ needs.build.outputs.extension }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous-tag }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package="artifacts/${EXTENSION_NAME}-${VERSION}.vsix"
          checksum="${package}.sha256"
          expected_prerelease=false
          if [[ "$VERSION" == *-* ]]; then
            expected_prerelease=true
          fi

          release_is_draft=""
          if release_is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            release_name="$(gh release view "$TAG_NAME" --json name --jq '.name')"
            release_is_prerelease="$(gh release view "$TAG_NAME" --json isPrerelease --jq '.isPrerelease')"
            if [[ "$release_name" != "${DISPLAY_NAME} v${VERSION}" ]] || \
              [[ "$release_is_prerelease" != "$expected_prerelease" ]]; then
              echo "::error::Existing release metadata does not match ${TAG_NAME}."
              exit 1
            fi
          else
            create_args=(
              "$TAG_NAME"
              --draft
              --verify-tag
              --title "${DISPLAY_NAME} v${VERSION}"
            )
            if [[ "$expected_prerelease" == true ]]; then
              create_args+=(--prerelease)
            fi
            if [[ -n "$PREVIOUS_TAG" ]]; then
              create_args+=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
            else
              create_args+=(--notes "Initial ${DISPLAY_NAME} release.")
            fi
            gh release create "${create_args[@]}"
            release_is_draft=true
          fi

          existing_assets="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          download_dir="$(mktemp -d)"
          for asset in "$package" "$checksum"; do
            asset_name="$(basename "$asset")"
            if grep -Fxq "$asset_name" <<< "$existing_assets"; then
              gh release download "$TAG_NAME" --pattern "$asset_name" --dir "$download_dir"
              if ! cmp --silent "$asset" "$download_dir/$asset_name"; then
                echo "::error::Release asset ${asset_name} already exists with different content."
                exit 1
              fi
              continue
            fi

            if [[ "$release_is_draft" != true ]]; then
              echo "::error::Published release ${TAG_NAME} is missing immutable asset ${asset_name}."
              exit 1
            fi
            gh release upload "$TAG_NAME" "$asset"
          done

          if [[ "$release_is_draft" == true ]]; then
            gh release edit "$TAG_NAME" --draft=false
          fi
