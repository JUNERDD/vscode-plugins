packages:
  - "extensions/*"
  - "packages/*"

# Keep patched transitive versions until their direct dependents raise the same minimums.
overrides:
  "@pierre/theming": 1.0.1
  brace-expansion: 5.0.9
  fast-uri: 3.1.5
  js-yaml: 4.3.1
  "nanoid@3": 3.3.18
  postcss: 8.5.23

allowBuilds:
  "@vscode/vsce-sign": true
  keytar: true
  sharp: true
